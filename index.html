<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arifcard Admin</title>
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Anti-flash: applies the persisted/system theme before first paint so
      dark-mode users never see a light flash on load. Must run synchronously,
      before any stylesheet paints, and must mirror ThemeContext's storage
      key + resolution logic exactly.
    -->
    <script src="/theme-init.js"></script>

    <!-- Typography: Geist (docs/design-plan.md §2). The stylesheet itself is
         requested by theme-init.js so it never blocks the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
